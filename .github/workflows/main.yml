name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        if [ -f "VYRO_Android_Starter.zip" ]; then
          unzip -o VYRO_Android_Starter.zip
        fi

    - name: Downgrade Kotlin & Fix Compose Options
      run: |
        # Replace Kotlin 2.x with 1.9.20 in build files to bypass compiler error
        find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/2\.[0-9]\.[0-9]*/1.9.20/g' {} + || true
        find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/kotlin("android") version "[^"]*"/kotlin("android") version "1.9.20"/g' {} + || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        if [ -d "VYRO_Android" ]; then
          cd VYRO_Android
        fi
        chmod +x gradlew || true
        ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VYRO-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
