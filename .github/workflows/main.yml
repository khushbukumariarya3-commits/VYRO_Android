name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        if [ -f "VYRO_Android_Starter.zip" ]; then
          unzip -o VYRO_Android_Starter.zip
        fi

    - name: Fix Compose Compiler Plugin
      run: |
        # Inject Compose Compiler plugin for Kotlin 2.0+
        find . -name "build.gradle.kts" -exec sed -i 's/alias(libs.plugins.android.application)/alias(libs.plugins.android.application)\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0"/g' {} + || true
        find . -name "build.gradle" -exec sed -i 's/apply plugin: .com.android.application./apply plugin: "com.android.application"\napply plugin: "org.jetbrains.kotlin.plugin.compose"/g' {} + || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        ROOT_DIR=$(pwd)
        if [ -d "VYRO_Android" ]; then
          cd VYRO_Android
        fi
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon -Pandroid.experimental.artThatIgnoresKotlin20=true || gradle assembleDebug --no-daemon -Pandroid.experimental.artThatIgnoresKotlin20=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VYRO-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
