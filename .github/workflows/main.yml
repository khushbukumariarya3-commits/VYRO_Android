name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        if [ -f "VYRO_Android_Starter.zip" ]; then
          unzip -o VYRO_Android_Starter.zip
        fi

    - name: Fix Kotlin Compose Plugin Issue
      run: |
        # Inject Compose Compiler plugin if missing
        if [ -f "build.gradle.kts" ]; then
          sed -i 's/plugins {/plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false/' build.gradle.kts || true
        fi
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/plugins {/plugins {\n    id("org.jetbrains.kotlin.plugin.compose")/' app/build.gradle.kts || true
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        cd VYRO_Android || true
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VYRO-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        
