name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        if [ -f "VYRO_Android_Starter.zip" ]; then
          unzip -o VYRO_Android_Starter.zip
        fi

    - name: Inject Kotlin Compose Plugin
      run: |
        # Append Kotlin Compose plugin dynamically if Kotlin 2.0 is detected
        find . -name "build.gradle.kts" -exec sed -i '1s/^/plugins { id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false }\n/' {} + || true
        find . -name "build.gradle" -exec sed -i '1s/^/plugins { id "org.jetbrains.kotlin.plugin.compose" version "2.0.0" apply false }\n/' {} + || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ -n "$PROJECT_DIR" ]; then
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.experimental.artThatIgnoresKotlin20=true
        else
          gradle assembleDebug --no-daemon -Pandroid.experimental.artThatIgnoresKotlin20=true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VYRO-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
