name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Files
      run: |
        if [ -f "VYRO_Android_Starter.zip" ]; then
          unzip -o VYRO_Android_Starter.zip
        fi

    - name: Disable Jetpack Compose Requirement Temporarily
      run: |
        find . -name "build.gradle*" -exec sed -i 's/buildFeatures {/buildFeatures {\n        compose = false/g' {} + || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        if [ -d "VYRO_Android" ]; then
          cd VYRO_Android
        fi
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VYRO-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
